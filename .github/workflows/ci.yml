name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Catches import/syntax errors in app.py, which can't be unit-tested
      # directly since it runs as a Streamlit script rather than a library.
      - name: Byte-compile check
        run: python -m py_compile app.py pubfigure.py plotting.py processing.py xrd_io.py theme.py generate_examples.py
